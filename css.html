<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Styling Methods</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      font-family: Arial;
      max-width: 500px;
      
    }

    .internal-style {
      color: darkgreen;
      font-size: 18px;
      padding: 10px;
      border: 2px solid darkgreen;
    }

    .box {
      background-color: #f2f2f2;
      margin: 20px 0;
      padding: 15px;
    }
  </style>
</head>
<body>

  <h1>Different CSS Styling Methods</h1>

  <p style="color: red; font-weight: bold;">
    This paragraph uses inline CSS.
  </p>

  <p class="internal-style">
    This paragraph uses internal CSS.
  </p>

  <p class="external-style">
    This paragraph uses external CSS.
  </p>

  <div class="box">
    This styling is done from internal CSS.
  </div>

</body>
</html>
